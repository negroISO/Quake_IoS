// autoexec.cfg — CVAR-ONLY base. Pushed to com.quake3ios.app (Metal)
// by q3dev_run.sh / q3push_baseq3.sh. Runs LAST during engine boot so
// it overrides q3config.cfg. Purpose: identical, log-rich boot.
//
// NOTE: q3dev_run_ioq3.sh ASSEMBLES a different autoexec.cfg on the fly
// (this file's contents + the LAUNCH_COMMAND demo/video sequence) before
// pushing to the ioq3 sandbox — the ioq3 build does NOT honor the
// Q3_LAUNCH_COMMAND env var, so the only way to autostart the demo there
// is to put it in autoexec.cfg.

seta logfile 2          // flush qconsole.log after every print
seta developer 1        // open Com_DPrintf — every shader/texture/pk3 load surfaces
seta r_logFile 0        // do NOT enable per-GL-call gfxinfo.log (flood)
seta com_speeds 0       // keep r_speeds-style noise out of the log
